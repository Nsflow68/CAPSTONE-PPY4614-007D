name: mi_refugio_app
description: Aplicación Flutter Mi Refugio (fase 2) con nueva línea visual y chatbot Llama.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.3
  google_sign_in: ^6.2.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  intl: ^0.20.2
  fl_chart: ^0.69.0
  url_launcher: ^6.3.0
  equatable: ^2.0.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/google_logo.svg
    - assets/images/branding/
    - assets/images/government/
    - assets/images/mascot/
    - assets/images/mental_health/
    - assets/videos/
