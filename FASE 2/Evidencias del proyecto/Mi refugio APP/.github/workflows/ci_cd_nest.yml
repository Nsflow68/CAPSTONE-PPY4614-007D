name: CI/CD - NestJS Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/nest/**'
      - '.github/workflows/ci_cd_nest.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/nest/**'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/nest/package-lock.json

      - name: Install dependencies
        working-directory: backend/nest
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend/nest
        run: npx prisma generate

      - name: Run linter
        working-directory: backend/nest
        run: npm run lint

      - name: Run tests
        working-directory: backend/nest
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/nest/package-lock.json

      - name: Install dependencies
        working-directory: backend/nest
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend/nest
        run: npx prisma generate

      - name: Build application
        working-directory: backend/nest
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: nest-build
          path: backend/nest/dist
          retention-days: 7
