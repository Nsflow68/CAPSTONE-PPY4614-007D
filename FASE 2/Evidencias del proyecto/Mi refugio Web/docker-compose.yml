services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mirefugio}
      POSTGRES_USER: ${DB_USER:-mirefugio_user}
      POSTGRES_PASSWORD: ${DB_PASS:-mirefugio_local_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mirefugio_user} -d ${DB_NAME:-mirefugio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-local-docker-compose-secret-key-change-in-prod-9f8a7d6c5b4a3210}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0,web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME:-mirefugio}
      DB_USER: ${DB_USER:-mirefugio_user}
      DB_PASS: ${DB_PASS:-mirefugio_local_dev_pass}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
      DB_SEARCH_PATH: web,core,public
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      CONTACT_BYPASS_RECAPTCHA: ${CONTACT_BYPASS_RECAPTCHA:-1}
      TBK_ENV: ${TBK_ENV:-integration}
      TBK_RETURN_URL: ${TBK_RETURN_URL:-http://127.0.0.1:8000/donar/retorno/}
      DONATION_MIN_CLP: ${DONATION_MIN_CLP:-500}

volumes:
  postgres_data:

