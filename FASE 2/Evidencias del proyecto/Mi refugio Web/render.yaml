services:
  - type: web
    name: mi-refugio
    env: python
    buildCommand: pip install -r requirements.txt && COLLECTSTATIC_BUILD=1 python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn mirefugio.wsgi --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: mirefugio.settings
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: mi-refugio-web.onrender.com,mi-refugio.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://mi-refugio-web.onrender.com,https://mi-refugio.onrender.com
      - key: TBK_ENV
        value: integration
      - key: TBK_API_KEY_ID
        value: 597055555532
      - key: TBK_API_KEY_SECRET
        value: 579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C
      - key: TBK_RETURN_URL
        value: https://mi-refugio-web.onrender.com/donar/retorno/
      - key: RECAPTCHA_SECRET
        sync: false
    autoDeploy: true
databases:
  - name: mirefugio-db
